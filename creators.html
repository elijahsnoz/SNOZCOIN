<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SnozCoin — Creators</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="Discover creators on SnozCoin. Tip, unlock and support artists directly." />
  <meta name="robots" content="index,follow">
  <link rel="icon" href="assets/favicon-32x32.png" type="image/png">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img src="assets/SNOZCOIN-128.png" alt="SnozCoin" class="brand-logo">
        <span class="brand-text">SnozCoin</span>
      </a>
      <nav class="nav" id="nav">
        <a href="/">Home</a>
        <a href="/creators.html" class="active" aria-current="page">Creators</a>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/swap.html">Swap</a>
        <a href="/stats.html">Stats</a>
        <a href="/api.html">API</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="panel" id="creators-list">
      <div class="container">
        <h1>Featured Creators</h1>
        <p class="muted">Browse creators who accept SnozCoin for tips and unlockable content.</p>

        <div id="creatorsGrid" class="about-grid">
          <!-- Filled by JS -->
        </div>
      </div>
    </section>
  </main>

  <script src="js/creators.js"></script>
  <script>
    // Mobile menu toggle
    const navToggle = document.getElementById('navToggle');
    const nav = document.getElementById('nav');
    if (navToggle && nav) {
      navToggle.addEventListener('click', () => {
        nav.classList.toggle('show');
        navToggle.classList.toggle('active');
      });
    }
  </script>
</body>
</html>
