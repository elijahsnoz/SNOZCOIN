<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SnozCoin — Creators</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="Discover creators on SnozCoin. Tip, unlock and support artists directly." />
  <meta name="robots" content="index,follow">
  <link rel="icon" href="assets/favicon-32x32.png" type="image/png">
</head>
<body>
  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  
  <!-- Dynamic Header (rendered by JS) -->
  <div id="dynamic-header" data-active-page="creators"></div>

  <main>
    <section class="panel" id="creators-list">
      <div class="container">
        <h1>Featured Creators</h1>
        <p class="muted">Browse creators who accept SnozCoin for tips and unlockable content.</p>

        <div id="creatorsGrid" class="about-grid">
          <!-- Filled by JS -->
        </div>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="js/creators.js"></script>
  
  <!-- Dynamic Header & Wallet Auth -->
  <script src="https://unpkg.com/@stacks/connect@7.7.1/dist/umd/index.js"></script>
  <script src="js/wallet-auth.js"></script>
  <script src="js/header.js"></script>
  <script>
    // Initialize dynamic header
    DynamicHeader.init();
  </script>
</body>
</html>
